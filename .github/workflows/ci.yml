name: Image Checker CI                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                      
on:                                                                                                                                                                                                                                                                 
  push:                                                                                                                                                                                                                                                             
    branches: [ main ]                                                                                                                                                                                                                                              
  pull_request:          # 加这个:提 PR 时也跑,更规范                                                                                                                                                                                                               
    branches: [ main ]                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                    
jobs:                                                                                                                                                                                                                                                               
  test:                                                                                                                                                                                                                                                             
    runs-on: ubuntu-latest                                                                                                                                                                                                                                          
    steps:                                                                                                                                                                                                                                                          
      - name: 拉取代码                                                                                                                                                                                                                                              
        uses: actions/checkout@v4                                                                                                                                                                                                                                   
                                                                                                                                                                                                                                                                    
      - name: 安装 Python                                                                                                                                                                                                                                           
        uses: actions/setup-python@v5                                                                                                                                                                                                                               
        with:                                                                                                                                                                                                                                                       
          python-version: '3.12'      # 改成你项目用的 3.12                                                                                                                                                                                                         
                                                                                                                                                                                                                                                                    
      - name: 安装依赖                                                                                                                                                                                                                                              
        run: pip install -r requirements.txt                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                    
      - name: 生成测试图片       # ← 关键:CI 环境没有 images/,要先生成                                                                                                                                                                                              
        run: python make_test_images.py                                                                                                                                                                                                                             
                                                                                                                                                                                                                                                                    
      - name: 运行测试                                                                                                                                                                                                                                              
        run: pytest -v 